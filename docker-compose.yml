services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synkrone
      POSTGRES_PASSWORD: synkrone_pass
      POSTGRES_DB: synkrone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synkrone"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://synkrone:synkrone_pass@db:5432/synkrone?schema=public"
    volumes:
      - /mc:/mc
      - /Partage/Synkrone:/Partage/Synkrone
      - /var/log:/host/var/log:ro
      - /tmp:/host/tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
